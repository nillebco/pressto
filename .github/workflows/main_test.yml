name: main_test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  main_test:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      # The previous label, "xcode-27", matched no runner: this repository has no
      # self-hosted runners, so every push queued a job that never started.
      - name: Select the newest Xcode
        run: |
          set -eu
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort | tail -1)
          [ -n "$XCODE" ] || { echo "::error::no Xcode installed"; exit 1; }
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected $XCODE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run unit tests
        run: >-
          xcodebuild -project Scoot.xcodeproj -scheme Scoot
          -configuration Debug -destination 'platform=macOS'
          -skip-testing:ScootUITests build test CODE_SIGN_IDENTITY=-
