<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pressto">
<meta name="theme-color" content="#111214">
<title>Pressto Remote</title>
<style>
  :root {
    --bg: #111214; --key: #23252a; --key-hi: #33363d; --text: #f2f3f5; --muted: #9aa0a8;
    --accent: #4f8cff; --ok: #3ccf8e; --err: #ff6b6b; --radius: 16px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 480px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; }
  #status { font-weight: 400; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .row { display: grid; gap: 10px; margin-bottom: 10px; }
  .r2 { grid-template-columns: repeat(2, 1fr); } .r3 { grid-template-columns: repeat(3, 1fr); }
  .r4 { grid-template-columns: repeat(4, 1fr); }
  button { appearance: none; border: 0; border-radius: var(--radius); background: var(--key); color: var(--text);
    font: inherit; font-size: 15px; padding: 14px 6px; min-height: 52px; touch-action: manipulation; }
  button:active, button.held { background: var(--key-hi); }
  button.primary { background: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 72px); gap: 10px; margin: 16px 0; }
  .pad button { font-size: 26px; border-radius: 22px; }
  .pad .ok { font-size: 17px; font-weight: 600; background: var(--key-hi); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--key); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { min-height: 36px; padding: 8px 4px; border-radius: 9px; font-size: 14px; background: transparent; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--key-hi); color: var(--text); }
  label.cap { display: block; font-size: 12px; color: var(--muted); margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  form { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; }
  input { width: 100%; min-width: 0; border: 0; border-radius: 12px; background: var(--key); color: var(--text);
    font: inherit; font-size: 17px; padding: 12px 14px; user-select: text; -webkit-user-select: text; }
  details { margin-bottom: 10px; background: var(--key); border-radius: var(--radius); }
  summary { padding: 14px 16px; font-size: 15px; list-style-position: inside; }
  #tablist { display: grid; gap: 6px; padding: 0 8px 8px; }
  #tablist button { text-align: left; padding: 10px 12px; min-height: 48px; background: var(--bg); }
  #tablist small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  form button { min-height: 0; padding: 12px 14px; }
</style>
</head>
<body>
<h1><span>Pressto</span><span id="status" aria-live="polite">ready</span></h1>

<div class="row">
  <button data-ui="Back to TV" id="tv" class="primary">⟲ Back to TV</button>
</div>
<details id="tabs">
  <summary data-ui="Open tabs">Open tabs</summary>
  <div id="tablist"></div>
</details>
<div class="row r3">
  <button data-ui="Pointer" id="locate" aria-label="Show where the pointer is">◎ Pointer</button>
  <button data-ui="Site search" id="sitesearch" aria-label="Open the site's search">🔍 Site search</button>
  <button data-ui="Site home" id="sitehome" aria-label="Go to the site's home page">⌂ Site home</button>
</div>
<div class="row r2">
  <button data-ui="Page back" data-key="leftbracket" data-mods="command" aria-label="Previous page">◀ Page</button>
  <button data-ui="Page forward" data-key="rightbracket" data-mods="command" aria-label="Next page">Page ▶</button>
</div>

<div class="row r4">
  <button data-ui="Palette" data-mode="palette">Palette</button>
  <button data-ui="Labels" data-mode="labels">Labels</button>
  <button data-ui="Freestyle" data-mode="freestyle">Free</button>
  <button data-ui="Grid" data-mode="grid">Grid</button>
</div>

<label class="cap" id="arrows-cap">Arrows</label>
<div class="seg" role="group" aria-labelledby="arrows-cap">
  <button data-arrows="move" aria-pressed="true">Move</button>
  <button data-arrows="scroll" aria-pressed="false">Scroll</button>
  <button data-arrows="jump" aria-pressed="false">All the way</button>
</div>

<div class="pad">
  <span></span><button data-ui="Up" data-arrow="up" aria-label="Up">▲</button><span></span>
  <button data-ui="Left" data-arrow="left" aria-label="Left">◀</button>
  <button data-ui="OK" class="ok" data-key="return" aria-label="Return">OK</button>
  <button data-ui="Right" data-arrow="right" aria-label="Right">▶</button>
  <span></span><button data-ui="Down" data-arrow="down" aria-label="Down">▼</button><span></span>
</div>

<div class="row r3">
  <button data-ui="Esc" data-key="escape">Esc</button>
  <button data-ui="Tab" data-key="tab">Tab</button>
  <button data-ui="Delete (pad)" data-key="delete" aria-label="Delete">⌫</button>
</div>

<label class="cap">Playback</label>
<div class="row r3">
  <button data-ui="−10 s" data-key="left" aria-label="Back 10 seconds">−10 s</button>
  <button data-ui="Play/pause" data-key="space" class="primary" aria-label="Play or pause">⏯</button>
  <button data-ui="+10 s" data-key="right" aria-label="Forward 10 seconds">+10 s</button>
</div>
<div class="row r3">
  <button data-ui="Video full screen" data-key="f" aria-label="Video full screen (the site's player; Esc leaves it)">Video ⛶</button>
  <button data-ui="Window full screen" data-key="f" data-mods="control command" aria-label="Safari window full screen">Window ⛶</button>
  <span></span>
</div>
<label class="cap">Sound</label>
<div class="row r2">
  <button data-ui="Player mute" data-key="m" aria-label="Mute or unmute the video player (m)">Player 🔇 (m)</button>
  <button data-ui="Mac mute" data-volume="mute" aria-label="Mute or unmute the Mac">Mac 🔇</button>
</div>
<div class="row r2">
  <button data-ui="Mac volume down" data-volume="down" aria-label="Mac volume down">Mac 🔉 −</button>
  <button data-ui="Mac volume up" data-volume="up" aria-label="Mac volume up">Mac 🔊 +</button>
</div>
<div class="row r2">
  <button data-ui="Start (0)" data-key="0" aria-label="Back to the start (YouTube)">Start (0)</button>
  <button data-ui="Top of page" data-scroll-top aria-label="Scroll back to the top">Top of page</button>
</div>

<label class="cap" for="text">Search or type (🎤 on the keyboard to dictate)</label>
<form id="form" autocomplete="off">
  <input id="text" type="text" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="skip intro, youtube…">
  <button data-ui="Search (text)" type="submit" class="primary">Search</button>
  <button data-ui="Type (text)" type="button" id="type">Type</button>
  <button data-ui="Delete (text)" type="button" data-key="delete" aria-label="Delete on the Mac">⌫</button>
</form>

<script>
  const status = document.getElementById('status');
  let arrows = 'move';
  let control = null; // data-ui of the last button touched, for the usage counts
  document.addEventListener('pointerdown', (event) => {
    const button = event.target.closest('[data-ui]');
    if (button) control = button.dataset.ui + (button.dataset.arrow ? ' · ' + arrows : '');
  }, true);

  function show(text, cls) {
    status.textContent = text;
    status.className = cls || '';
  }

  async function send(path, body) {
    try {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(control ? { ...body, ui: control } : body),
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) show(typeof data.detail === 'string' ? data.detail : 'ok', 'ok');
      else show(data.error || ('error ' + response.status), 'err');
      return response.ok ? data.detail : null;
    } catch (error) {
      show('offline', 'err');
      return null;
    }
  }

  const key = (name, modifiers) => send('/v1/key', { key: name, modifiers: modifiers || [] });

  // Hold to repeat: scrolling and moving the pointer want it.
  function repeatable(button, action) {
    let delay, timer;
    const stop = () => { clearTimeout(delay); clearInterval(timer); button.classList.remove('held'); };
    button.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      button.classList.add('held');
      action();
      delay = setTimeout(() => { timer = setInterval(action, 110); }, 380);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => button.addEventListener(type, stop));
  }

  document.querySelectorAll('[data-arrow]').forEach((button) => {
    repeatable(button, () => {
      if (arrows === 'move') key(button.dataset.arrow);
      else send('/v1/scroll', { direction: button.dataset.arrow, all: arrows === 'jump' });
    });
  });

  document.querySelectorAll('[data-key]').forEach((button) => {
    if (button.dataset.key === 'delete') repeatable(button, () => key('delete'));
    else button.addEventListener('click', () => key(button.dataset.key, (button.dataset.mods || '').split(' ').filter(Boolean)));
  });

  document.querySelectorAll('[data-mode]').forEach((button) => {
    button.addEventListener('click', () => send('/v1/mode', { mode: button.dataset.mode }));
  });

  document.querySelectorAll('[data-arrows]').forEach((button) => {
    button.addEventListener('click', () => {
      arrows = button.dataset.arrows;
      document.querySelectorAll('[data-arrows]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
    });
  });

  document.querySelectorAll('[data-volume]').forEach((button) => {
    const change = () => send('/v1/volume', { change: button.dataset.volume });
    if (button.dataset.volume === 'mute') button.addEventListener('click', change);
    else repeatable(button, change);
  });

  // Open tabs: read when the section opens, one button per tab.
  const tabs = document.getElementById('tabs');
  const tablist = document.getElementById('tablist');
  async function loadTabs() {
    tablist.textContent = 'Loading…';
    const list = await send('/v1/tabs', {});
    tablist.textContent = '';
    if (!Array.isArray(list) || !list.length) { tablist.textContent = 'No tabs'; return; }
    show(list.length + ' tabs', 'ok');
    for (const tab of list) {
      const button = document.createElement('button');
      button.dataset.ui = 'Tab (from list)';
      button.textContent = tab.title || tab.host || ('Tab ' + tab.index);
      const host = document.createElement('small');
      host.textContent = tab.host;
      button.append(host);
      button.addEventListener('click', async () => {
        await send('/v1/tab', { index: tab.index });
        tabs.open = false;
      });
      tablist.append(button);
    }
  }
  tabs.addEventListener('toggle', () => { if (tabs.open) loadTabs(); });

  document.getElementById('tv').addEventListener('click', () => send('/v1/focus', {}));
  document.getElementById('locate').addEventListener('click', () => send('/v1/locate', {}));
  document.getElementById('sitehome').addEventListener('click', () => send('/v1/home', {}));
  document.getElementById('sitesearch').addEventListener('click', () =>
    send('/v1/sitesearch', { labels: ['Search', 'Rechercher', 'Recherche', 'Cerca', 'Open search', 'Ouvrir la recherche'] }));
  document.querySelector('[data-scroll-top]').addEventListener('click', () => send('/v1/scroll', { direction: 'up', all: true }));

  const input = document.getElementById('text');
  document.getElementById('form').addEventListener('submit', (event) => {
    event.preventDefault();
    control = 'Search (text)'; // Enter on the keyboard, not only the button
    const text = input.value.trim();
    if (text) send('/v1/search', { text });
    input.value = '';
    input.blur();
  });
  document.getElementById('type').addEventListener('click', () => {
    const text = input.value;
    if (text) send('/v1/type', { text });
    input.value = '';
  });
</script>
</body>
</html>
